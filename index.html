<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 
    <div class="header">

        <div class="topbar">

            <div >
                <img id="logo" src="media/KLYUYURAN-removebg-preview.png" alt="logo">
            </div>

            <div >
                <img id="menu" src="media/menu-burger-horizontal-svgrepo-com.svg" alt="logo">
            </div>
        </div>

        <div class="textbox">

            <h1 id="main"> Explore The World Around You </h1>

            <h2 id="sub">Take a break from your everyday life, plan trips and explore your favourite destinations.</h2>


        </div>

    </div>  

    <div class="destinationform">

        <span class="locationBox">
            <h2>Your Location</h2>
            <h3>Lucknow, Uttar Pradesh</h3>
        </span>

        <form action="">
            <label for="Location">Location </label>
            <input type="text" id="Location" name="Location">

            <br>

            <label for="check-in">Enter the check-in date</label>
            <input type="date" id="check-in" name="check-in">

            <br>

            <label for="check-out">Enter the check-out date</label>
            <input type="date" id="check-out" name="check-out">

            <br>

            <button>submit</button>

        </form>
    </div>


</body>
</html>
